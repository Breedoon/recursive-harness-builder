[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-agent"
version = "0.1.0"
description = "Recursive AI-agent harness with markdown procedures and optional Telegram UI"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.1.44",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.2.0",
    "prompt-toolkit>=3.0.0",
    "python-telegram-bot>=21.0",
    "markdown-it-py>=3.0",
    "croniter>=3.0.3",
    "telethon>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "pexpect>=4.9.0",
]

[project.scripts]
obs-agent = "obs_agent.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that spend live model/provider calls",
    "eval: eval scenarios run by SDK judge agent against real CLI + vault",
    "integration: live HTTP + SDK integration tests",
    "telegram: Telegram-specific eval scenarios (require OBS_TELEGRAM_BOT_USERNAME)",
    "telegram_smoke: dense live Telegram smoke scenarios for fast dev-loop validation",
    "telegram_core_smoke: frequent core live Telegram smoke scenarios covering multiple user journeys",
    "telegram_focused: focused live Telegram diagnostics for a specific feature or regression",
    "telegram_special: live Telegram tests requiring special resources or setup (provider/model, cache, multi-bot, restart, schedule, provisioning, soak)",
    "telegram_parallel: live Telegram tests or orchestrators intended for isolated parallel execution",
    "telegram_soak: long-running Telegram soak scenarios (around one hour)",
    "real_get_client: opt out of the autouse get_client mock (for tests that test client lifecycle)",
    "serial: tests that must run in isolation (e.g. stops/restarts external services)",
]
testpaths = ["tests"]
pythonpath = ["src"]

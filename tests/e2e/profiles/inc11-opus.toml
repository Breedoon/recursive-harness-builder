# inc11-opus (dev credentials, Opus; scenario 6 only): Claude lane on the single existing Claude OAuth credential (lane copy without
# the refresh token, tests/e2e/harness/creds.py), a test bot from the pool, Haiku.
# Secret references only; values live in the secrets file (default /workspace/obs/.env).
name = "inc11-opus"
credential_class = "dev"
route = "claude"
model = "opus"
claude_credentials = "shared-lane-copy"
bot_pool = "env:OBS_TEST_TELEGRAM_BOT_TOKENS"
bot_pool_exclude = ["env:OBS_TEST_TELEGRAM_BOT_TOKEN"]
userbot_id_ref = "env:OBS_TEST_TELEGRAM_ALLOWED_USERS#0"
needs_cliproxy = false
spend_cap_usd = 5.0

[lane_env]
OBS_AGENT_MODEL = "opus"
OBS_DEFAULT_MODEL = "opus"
OBS_EFFORT_LEVEL = "low"
OBS_NEW_SESSION_EFFORT_LEVEL = "low"

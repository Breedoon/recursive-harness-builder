# obs-e2e pytest config (used with -c tests/e2e/pytest.ini --rootdir <checkout>).
# The repository's pyproject.toml pytest section is deliberately NOT used: E2E runs
# load only tests/e2e/conftest.py and the obs-e2e plugin, and every async test and
# fixture shares one session event loop (the lane's inotify tail lives there).
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests/e2e
python_files = test_*.py
addopts = -p tests.e2e.harness.plugin --confcutdir=tests/e2e -p no:cacheprovider
markers =
    obs_e2e_unqualified_known_bug(bead, why): internal marker set by the obs-e2e plugin

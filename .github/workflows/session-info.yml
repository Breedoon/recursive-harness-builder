name: Session implementation validation

on:
  push:
    branches: [docs/agent-session-info]
    paths: [.github/session-patch.*]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.repository == 'Breedoon/recursive-harness-builder' && github.ref == 'refs/heads/docs/agent-session-info'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/agent-session-info
      - name: Apply reviewed patch to the feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib, lzma, os, subprocess
          from pathlib import Path
          parts = [Path(f'.github/session-patch.{i}.bin') for i in range(3)]
          payload = lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(payload).hexdigest() == '0b3af49ff7fd3249c7138af9a94a7e9aa45fbff105c49e8a6708ec50447109aa'
          patch = Path(os.environ['RUNNER_TEMP']) / 'session-reviewed.patch'
          patch.write_bytes(payload)
          subprocess.run(['git', 'apply', '--exclude=.github/workflows/session-checks.yml', '--index', str(patch)], check=True)
          PY
          git diff --cached --check
          git rm .github/session-patch.0.bin .github/session-patch.1.bin .github/session-patch.2.bin
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: document agent architecture and replace context with session information'
          git push origin HEAD:refs/heads/docs/agent-session-info
          git rev-parse HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra dev
      - name: Export offline test dependencies without the CLI binary
        run: tar --exclude='*/_bundled' --exclude='*/__pycache__' -czf "$RUNNER_TEMP/session-test-dependencies.tar.gz" -C .venv/lib/python3.13/site-packages .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-test-dependencies
          path: ${{ runner.temp }}/session-test-dependencies.tar.gz
          retention-days: 1
      - name: Run offline session and context regressions
        run: |
          .venv/bin/python -m pytest -q --tb=short \
            tests/test_session_info.py tests/test_effort.py \
            tests/test_session.py tests/test_config.py tests/test_hooks.py \
            tests/test_lineage.py tests/test_context_stats.py tests/test_context_jsonl.py \
            tests/test_context_jsonl_resilience.py \
            tests/test_telegram.py tests/test_telegram_state_store.py \
            tests/test_cli.py tests/test_daemon.py tests/test_tools.py \
            --junitxml=session-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: session-test-results
          path: session-results.xml
          retention-days: 7

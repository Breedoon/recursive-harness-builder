name: Session information

on:
  push:
    branches: [docs/agent-session-info]
  pull_request:
    paths:
      - src/obs_agent/**
      - tests/test_session*.py
      - .github/workflows/session-info.yml

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Export tracked review snapshot
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/session-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-source
          path: ${{ runner.temp }}/session-source.tar
          retention-days: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra dev
      - name: Run offline baseline unit regressions
        run: |
          .venv/bin/python -m pytest -q --tb=short \
            tests/test_effort.py tests/test_config.py tests/test_session.py \
            tests/test_tools.py tests/test_telegram.py tests/test_telegram_state_store.py \
            tests/test_cli.py tests/test_daemon.py --junitxml=session-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: session-test-results
          path: session-results.xml
          retention-days: 7

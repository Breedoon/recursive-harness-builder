name: Concurrency development checks
on:
  push:
    branches: [feat/recursive-concurrency-budgets]
    paths: [.github/workflows/concurrency-development.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install locked dependencies and prepare offline development source
        run: |
          python -m pip install uv
          uv sync --frozen --extra dev
          mkdir -p /tmp/concurrency-source
          git archive HEAD | tar -x -C /tmp/concurrency-source
          uv export --frozen --extra dev --no-emit-project --no-hashes > /tmp/concurrency-requirements.txt
          python -m pip download -r /tmp/concurrency-requirements.txt -d /tmp/concurrency-wheels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: concurrency-source
          path: /tmp/concurrency-source
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: concurrency-wheels
          path: /tmp/concurrency-wheels
          retention-days: 3
      - name: Baseline offline regression suite
        run: |
          .venv/bin/python -m pytest -q --tb=short --timeout=30 \
            tests/test_branch_serialization.py tests/test_inbox_wake_detach.py \
            tests/test_session_info.py tests/test_effort.py tests/test_runner.py \
            tests/test_session.py tests/test_config.py tests/test_hooks.py \
            tests/test_lineage.py tests/test_telegram.py tests/test_telegram_state_store.py \
            tests/test_cli.py tests/test_daemon.py tests/test_tools.py \
            --junitxml=concurrency-baseline.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: concurrency-baseline
          path: concurrency-baseline.xml
          retention-days: 7

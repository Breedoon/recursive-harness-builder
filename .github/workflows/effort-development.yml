name: Finalize effort regression tests
on:
  push:
    branches: [feat/effort-controls]
    paths: [.github/workflows/effort-development.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/effort-controls
      - uses: astral-sh/setup-uv@v6
      - name: Apply regression updates and remove development files
        run: |
          git apply --check .effort-fixes.patch
          git apply .effort-fixes.patch
          rm .effort-fixes.patch .github/workflows/effort-development.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows
          git add -u
          git commit -m 'test: cover effort persistence and actual Claude HTTP payloads'
          git push origin HEAD:feat/effort-controls
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Verify installed CLI effort payloads without external networking
        shell: bash
        run: |
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            cd "$2"
            exec runuser -u "$1" -- env OBS_RUN_LOCAL_CLAUDE_CONTEXT_TESTS=1 \
              "$2/.venv/bin/python" -m pytest -q --tb=short \
              tests/test_effort_binary.py --junitxml="$2/effort-binary-results.xml"
          ' _ "$(id -un)" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effort-binary-results
          path: effort-binary-results.xml
          retention-days: 7

name: Finalize effort regression tests
on:
  push:
    branches: [feat/effort-controls]
    paths: [.github/workflows/effort-development.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/effort-controls
      - uses: astral-sh/setup-uv@v6
      - name: Apply regression updates
        run: |
          git apply --exclude='.github/workflows/*' --check .effort-fixes.patch
          git apply --exclude='.github/workflows/*' .effort-fixes.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_context_process_boundary.py')
          s = p.read_text()
          old = 'assert json.loads(settings_arg)["env"] == observed["budget_env"]'
          assert old in s
          p.write_text(s.replace(old, 'settings_env = json.loads(settings_arg)["env"]\n    assert {key: settings_env[key] for key in BUDGET_KEYS} == observed["budget_env"]'))
          PY
          rm .effort-fixes.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git add -u .effort-fixes.patch
          git commit -m 'test: cover effort persistence and actual Claude HTTP payloads'
          git push origin HEAD:feat/effort-controls
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Verify installed CLI effort payloads without external networking
        shell: bash
        run: |
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            cd "$2"
            exec runuser -u "$1" -- env OBS_RUN_LOCAL_CLAUDE_CONTEXT_TESTS=1 \
              "$2/.venv/bin/python" -m pytest -q --tb=short \
              tests/test_effort_binary.py --junitxml="$2/effort-binary-results.xml"
          ' _ "$(id -un)" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effort-binary-results
          path: effort-binary-results.xml
          retention-days: 7

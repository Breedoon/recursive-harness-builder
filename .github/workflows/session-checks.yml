name: Session metadata checks

on:
  pull_request:
    paths:
      - src/obs_agent/**
      - tests/test_session_info.py
      - tests/test_effort.py
      - .github/workflows/session-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra dev
      - name: Run offline session and context regressions
        run: |
          .venv/bin/python -m pytest -q --tb=short \
            tests/test_session_info.py tests/test_effort.py \
            tests/test_session.py tests/test_config.py tests/test_hooks.py \
            tests/test_lineage.py tests/test_context_stats.py tests/test_context_jsonl.py \
            tests/test_context_jsonl_resilience.py \
            tests/test_telegram.py tests/test_telegram_state_store.py \
            tests/test_cli.py tests/test_daemon.py tests/test_tools.py \
            --junitxml=session-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: session-test-results
          path: session-results.xml
          retention-days: 7
